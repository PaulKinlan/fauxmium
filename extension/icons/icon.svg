<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#12131c"/>
      <stop offset="100%" stop-color="#1e2030"/>
    </linearGradient>
    <linearGradient id="prism" x1="20" y1="20" x2="108" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff8b94"/>
      <stop offset="50%" stop-color="#a8e6cf"/>
      <stop offset="100%" stop-color="#70a1ff"/>
    </linearGradient>
    <linearGradient id="sparkGrad" x1="46" y1="46" x2="82" y2="82" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#eaf3ff"/>
      <stop offset="100%" stop-color="#c9e0ff"/>
    </linearGradient>
    <filter id="ringGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="sparkGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Squircle Container -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#bg)" stroke="#2c2e47" stroke-width="2.5"/>

  <!-- Browser Traffic Dots -->
  <circle cx="26" cy="22" r="3" fill="#ff8b94" opacity="0.85"/>
  <circle cx="36" cy="22" r="3" fill="#a8e6cf" opacity="0.85"/>
  <circle cx="46" cy="22" r="3" fill="#70a1ff" opacity="0.85"/>

  <!-- Glowing Synthetic Portal / Prism Ring -->
  <circle cx="64" cy="66" r="33" fill="none" stroke="url(#prism)" stroke-width="7" stroke-linecap="round" filter="url(#ringGlow)" opacity="0.4"/>
  <circle cx="64" cy="66" r="33" fill="none" stroke="url(#prism)" stroke-width="6.5" stroke-linecap="round"/>

  <!-- Inner Portal Fill / Depth -->
  <circle cx="64" cy="66" r="28" fill="#151724" opacity="0.85"/>

  <!-- Geometric Spark / Monogram Portal Center -->
  <path d="M 64,44 Q 64,66 42,66 Q 64,66 64,88 Q 64,66 86,66 Q 64,66 64,44 Z" fill="url(#sparkGrad)" filter="url(#sparkGlow)"/>
  <polygon points="64,52 74,66 64,80 54,66" fill="#ffffff" opacity="0.95"/>
  <polygon points="64,58 70,66 64,74 58,66" fill="#70a1ff" opacity="0.9"/>
  <circle cx="64" cy="66" r="2.5" fill="#ffffff"/>
</svg>
