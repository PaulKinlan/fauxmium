<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fauxmium Control Panel</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="panel">
    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <svg class="header-icon" width="20" height="20" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="h-prism" x1="20" y1="20" x2="108" y2="108" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#ff8b94"/>
              <stop offset="50%" stop-color="#a8e6cf"/>
              <stop offset="100%" stop-color="#70a1ff"/>
            </linearGradient>
          </defs>
          <rect x="6" y="6" width="116" height="116" rx="28" fill="#181926" stroke="#2c2e47" stroke-width="3"/>
          <circle cx="26" cy="22" r="3.5" fill="#ff8b94"/>
          <circle cx="36" cy="22" r="3.5" fill="#a8e6cf"/>
          <circle cx="46" cy="22" r="3.5" fill="#70a1ff"/>
          <circle cx="64" cy="66" r="33" fill="none" stroke="url(#h-prism)" stroke-width="7" stroke-linecap="round"/>
          <circle cx="64" cy="66" r="28" fill="#12131c"/>
          <path d="M 64,44 Q 64,66 42,66 Q 64,66 64,88 Q 64,66 86,66 Q 64,66 64,44 Z" fill="#ffffff"/>
          <polygon points="64,52 74,66 64,80 54,66" fill="#70a1ff"/>
        </svg>
        <h1 class="logo">Fauxmium</h1>
        <span class="version-tag">AI Web</span>
      </div>
      <div class="header-right">
        <div class="total-badge" id="total-cost">$0.000000</div>
      </div>
    </header>

    <!-- Quick Action Bar -->
    <div class="action-bar">
      <button id="btn-reload" class="btn btn-primary" title="Bypass cache and regenerate active tab">↻ Regenerate Tab</button>
      <button id="btn-clear-cache" class="btn btn-secondary" title="Flush HTML, Image, Video, and Audio cache">Clear Cache</button>
      <button id="btn-reset-costs" class="btn btn-secondary" title="Reset session spending logs">Reset Costs</button>
    </div>

    <!-- Status Message Banner -->
    <div id="status-banner" class="status-banner hidden"></div>

    <!-- Section: Browsing Lens -->
    <section class="section">
      <div class="section-header">
        <label for="lens-select" class="section-title">Browsing Lens</label>
        <span class="section-hint">Simulate different eras & worlds</span>
      </div>
      <select id="lens-select" class="select-input">
        <option value="modern">Modern Web (Responsive & Clean)</option>
        <option value="geocities-1997">1997 GeoCities / Web 1.0</option>
        <option value="web2-2007">2007 Frutiger Aero / Web 2.0</option>
        <option value="cyberpunk-2077">2077 Cyberpunk Net</option>
        <option value="solarpunk-2040">2040 Solarpunk</option>
        <option value="noir-1940s">1940s Noir Broadsheet</option>
        <option value="custom">Custom World Prompt...</option>
      </select>
      <textarea id="custom-lens-input" class="textarea-input hidden" rows="2" placeholder="Describe the world, aesthetic, or rules for generated pages..."></textarea>
    </section>

    <!-- Section: Media & Model Toggles -->
    <section class="section">
      <div class="section-header">
        <span class="section-title">Generation Models & Media</span>
      </div>

      <div class="config-grid">
        <!-- Text -->
        <div class="config-row">
          <span class="config-label">Text</span>
          <input type="text" id="text-model-input" class="text-input" placeholder="gemini-3.8-flash">
        </div>

        <!-- Image -->
        <div class="config-row">
          <label class="toggle-container">
            <input type="checkbox" id="image-enabled" checked>
            <span class="toggle-slider"></span>
            <span class="config-label">Images</span>
          </label>
          <input type="text" id="image-model-input" class="text-input" placeholder="gemini-3.1-flash-image">
        </div>

        <!-- Video -->
        <div class="config-row">
          <label class="toggle-container">
            <input type="checkbox" id="video-enabled" checked>
            <span class="toggle-slider"></span>
            <span class="config-label">Videos</span>
          </label>
          <input type="text" id="video-model-input" class="text-input" placeholder="veo-3.1-generate-preview">
        </div>

        <!-- Audio -->
        <div class="config-row">
          <label class="toggle-container">
            <input type="checkbox" id="audio-enabled" checked>
            <span class="toggle-slider"></span>
            <span class="config-label">Audio</span>
          </label>
          <select id="audio-provider-select" class="select-input-sm">
            <option value="synth">Synth (WAV $0)</option>
            <option value="openai">OpenAI (TTS)</option>
            <option value="gemini">Gemini</option>
          </select>
        </div>
      </div>
      <button id="btn-save-config" class="btn btn-save">Apply Settings</button>
    </section>

    <!-- Section: Spend Breakdown -->
    <section class="section">
      <div class="section-header">
        <span class="section-title">Session Spend Breakdown</span>
      </div>
      <div class="metrics-grid">
        <div class="metric-card">
          <span class="metric-title">Text</span>
          <span class="metric-value" id="spend-text">$0.00</span>
        </div>
        <div class="metric-card">
          <span class="metric-title">Images</span>
          <span class="metric-value" id="spend-image">$0.00</span>
        </div>
        <div class="metric-card">
          <span class="metric-title">Videos</span>
          <span class="metric-value" id="spend-video">$0.00</span>
        </div>
        <div class="metric-card">
          <span class="metric-title">Audio</span>
          <span class="metric-value" id="spend-audio">$0.00</span>
        </div>
      </div>
    </section>

    <!-- Section: Request Activity Log -->
    <section class="section log-section">
      <div class="section-header">
        <span class="section-title">Recent Requests (<span id="req-count">0</span>)</span>
      </div>
      <div id="requests-list" class="requests-list">
        <div class="empty-state">No requests recorded yet.</div>
      </div>
    </section>
  </div>

  <script src="popup.js"></script>
</body>
</html>
